<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Atletas</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        h2 {
            color: #005f9e;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input, select, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #005f9e;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #ff4500;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Cadastro de Atleta</h2>
        <form id="cadastro-form">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" required min="10">

            <label for="email">E-mail:</label>
            <input type="email" id="email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" required minlength="6" placeholder="Mínimo 6 caracteres">

            <label for="confirmar-senha">Confirmar Senha:</label>
            <input type="password" id="confirmar-senha" required minlength="6" placeholder="Repita sua senha">

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" required placeholder="000.000.000-00" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}">

            <label for="modalidade">Modalidade:</label>
            <select id="modalidade" required>
                <option value="Boxe">Boxe</option>
                <option value="Futebol">Futebol</option>
                <option value="Natação">Natação</option>
                <option value="Taekwondo">Taekwondo</option>
                <option value="Vôlei">Vôlei</option>
                <option value="MMA">MMA</option>
            </select>

            <button type="submit">Cadastrar</button>
        </form>
    </div>

    <script>
        document.getElementById("cadastro-form").addEventListener("submit", function(event) {
            event.preventDefault();
            const nome = document.getElementById("nome").value;
            const idade = document.getElementById("idade").value;
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const confirmarSenha = document.getElementById("confirmar-senha").value;
            const cpf = document.getElementById("cpf").value;
            const modalidade = document.getElementById("modalidade").value;

            if (senha.length < 6) {
                alert("A senha deve ter pelo menos 6 caracteres.");
                return;
            }

            if (senha !== confirmarSenha) {
                alert("As senhas não coincidem! Digite novamente.");
                return;
            }

            alert(`Atleta cadastrado!\nNome: ${nome}\nIdade: ${idade}\nE-mail: ${email}\nCPF: ${cpf}\nModalidade: ${modalidade}`);
        });
    </script>

</body>
</html>
